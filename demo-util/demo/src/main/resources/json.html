<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON转表格 - 在线工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .panel-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 10;
        }

        th {
            color: white;
            font-weight: 600;
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            white-space: nowrap;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f9fafb;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .stat-value {
            font-weight: 600;
            color: #667eea;
            margin-left: 5px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #dc2626;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .nested-json {
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
        }

        .nested-json:hover {
            background: #e5e7eb;
        }

        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none;
            }
            .panel {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 JSON转表格工具</h1>
        
        <div class="main-grid">
            <div class="panel">
                <div class="panel-title">JSON 输入</div>
                <textarea 
                    id="jsonInput" 
                    placeholder='粘贴JSON数据到这里，例如：
[
  {"name": "张三", "age": 25, "city": "北京"},
  {"name": "李四", "age": 30, "city": "上海"}
]'
                ></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="convertToTable()">
                        <span>🔄</span> 转换为表格
                    </button>
                    <button class="btn-secondary" onclick="loadExample()">
                        <span>📝</span> 加载示例
                    </button>
                    <button class="btn-secondary" onclick="clearAll()">
                        <span>🗑️</span> 清空
                    </button>
                    <button class="btn-secondary" onclick="formatJSON()">
                        <span>✨</span> 格式化JSON
                    </button>
                </div>
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </div>

            <div class="panel">
                <div class="panel-title">表格预览</div>
                <input 
                    type="text" 
                    id="searchBox" 
                    class="search-box" 
                    placeholder="🔍 搜索表格内容..."
                    oninput="searchTable()"
                >
                <div id="stats" class="stats" style="display: none;">
                    <div class="stat-item">行数：<span class="stat-value" id="rowCount">0</span></div>
                    <div class="stat-item">列数：<span class="stat-value" id="colCount">0</span></div>
                </div>
                <div id="tableContainer" class="table-container">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div>表格将显示在这里</div>
                    </div>
                </div>
                <div class="button-group no-print" style="margin-top: 15px;">
                    <button class="btn-success" onclick="exportToCSV()">
                        <span>📥</span> 导出CSV
                    </button>
                    <button class="btn-secondary" onclick="exportToExcel()">
                        <span>📊</span> 导出Excel
                    </button>
                    <button class="btn-secondary" onclick="window.print()">
                        <span>🖨️</span> 打印
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentData = [];
        let currentHeaders = [];

        function convertToTable() {
            const input = document.getElementById('jsonInput').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!input) {
                showError('请输入JSON数据');
                return;
            }

            try {
                let data = JSON.parse(input);
                
                // 如果不是数组，转换为数组
                if (!Array.isArray(data)) {
                    data = [data];
                }

                if (data.length === 0) {
                    showError('JSON数组为空');
                    return;
                }

                currentData = data;
                
                // 提取所有可能的键
                const allKeys = new Set();
                data.forEach(item => {
                    Object.keys(item).forEach(key => allKeys.add(key));
                });
                
                currentHeaders = Array.from(allKeys);

                renderTable(data, currentHeaders);
                showSuccess(`成功转换 ${data.length} 条数据`);
                
                // 更新统计信息
                document.getElementById('rowCount').textContent = data.length;
                document.getElementById('colCount').textContent = currentHeaders.length;
                document.getElementById('stats').style.display = 'flex';

            } catch (e) {
                showError('JSON解析失败：' + e.message);
            }
        }

        function renderTable(data, headers) {
            const container = document.getElementById('tableContainer');
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <div>没有数据可显示</div>
                    </div>
                `;
                return;
            }

            let html = '<table><thead><tr>';
            
            // 表头
            headers.forEach(header => {
                html += `<th>${escapeHtml(header)}</th>`;
            });
            
            html += '</tr></thead><tbody>';
            
            // 表体
            data.forEach(row => {
                html += '<tr>';
                headers.forEach(header => {
                    const value = row[header];
                    html += `<td>${formatValue(value)}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function formatValue(value) {
            if (value === null || value === undefined) {
                return '<span style="color: #999;">-</span>';
            }
            
            if (typeof value === 'object') {
                const str = JSON.stringify(value);
                if (str.length > 50) {
                    return `<span class="nested-json" title="${escapeHtml(str)}">${str.substring(0, 50)}...</span>`;
                }
                return `<span class="nested-json">${escapeHtml(str)}</span>`;
            }
            
            if (typeof value === 'boolean') {
                return value ? '<span style="color: #10b981;">✓ true</span>' : '<span style="color: #ef4444;">✗ false</span>';
            }
            
            if (typeof value === 'number') {
                return `<span style="color: #667eea; font-weight: 600;">${value}</span>`;
            }
            
            if (typeof value === 'string') {
                if (value.match(/^\d{4}-\d{2}-\d{2}/)) {
                    return `<span style="color: #f59e0b;">${escapeHtml(value)}</span>`;
                }
                if (value.match(/^https?:\/\//)) {
                    return `<a href="${escapeHtml(value)}" target="_blank" style="color: #667eea;">${escapeHtml(value)}</a>`;
                }
            }
            
            return escapeHtml(String(value));
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function searchTable() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const rows = document.querySelectorAll('#tableContainer tbody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        function exportToCSV() {
            if (currentData.length === 0) {
                showError('没有数据可导出');
                return;
            }

            let csv = currentHeaders.map(h => `"${h}"`).join(',') + '\n';
            
            currentData.forEach(row => {
                const values = currentHeaders.map(header => {
                    let value = row[header];
                    if (typeof value === 'object') {
                        value = JSON.stringify(value);
                    }
                    return `"${String(value || '').replace(/"/g, '""')}"`;
                });
                csv += values.join(',') + '\n';
            });

            downloadFile(csv, 'data.csv', 'text/csv');
            showSuccess('CSV文件已导出');
        }

        function exportToExcel() {
            if (currentData.length === 0) {
                showError('没有数据可导出');
                return;
            }

            let html = '<table><tr>';
            currentHeaders.forEach(h => {
                html += `<th>${h}</th>`;
            });
            html += '</tr>';
            
            currentData.forEach(row => {
                html += '<tr>';
                currentHeaders.forEach(header => {
                    let value = row[header];
                    if (typeof value === 'object') {
                        value = JSON.stringify(value);
                    }
                    html += `<td>${value || ''}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</table>';

            const blob = new Blob(['\ufeff', html], {
                type: 'application/vnd.ms-excel'
            });
            
            downloadFile(blob, 'data.xls', 'application/vnd.ms-excel');
            showSuccess('Excel文件已导出');
        }

        function downloadFile(content, filename, type) {
            const blob = content instanceof Blob ? content : new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadExample() {
            const example = [
                {
                    "id": 1,
                    "name": "张三",
                    "age": 28,
                    "email": "zhangsan@example.com",
                    "department": "技术部",
                    "salary": 15000,
                    "joinDate": "2020-03-15",
                    "skills": ["JavaScript", "Python", "Java"]
                },
                {
                    "id": 2,
                    "name": "李四",
                    "age": 32,
                    "email": "lisi@example.com",
                    "department": "产品部",
                    "salary": 18000,
                    "joinDate": "2019-07-22",
                    "skills": ["产品设计", "数据分析"]
                },
                {
                    "id": 3,
                    "name": "王五",
                    "age": 26,
                    "email": "wangwu@example.com",
                    "department": "设计部",
                    "salary": 13000,
                    "joinDate": "2021-01-10",
                    "skills": ["UI设计", "UX设计", "Figma"]
                }
            ];
            
            document.getElementById('jsonInput').value = JSON.stringify(example, null, 2);
            showSuccess('示例数据已加载');
        }

        function formatJSON() {
            const input = document.getElementById('jsonInput');
            try {
                const data = JSON.parse(input.value);
                input.value = JSON.stringify(data, null, 2);
                showSuccess('JSON已格式化');
            } catch (e) {
                if (input.value.trim()) {
                    showError('JSON格式错误，无法格式化');
                }
            }
        }

        function clearAll() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('tableContainer').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <div>表格将显示在这里</div>
                </div>
            `;
            document.getElementById('stats').style.display = 'none';
            document.getElementById('searchBox').value = '';
            currentData = [];
            currentHeaders = [];
            showSuccess('已清空');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // 支持Ctrl+Enter快速转换
        document.getElementById('jsonInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                convertToTable();
            }
        });
    </script>
</body>
</html>
